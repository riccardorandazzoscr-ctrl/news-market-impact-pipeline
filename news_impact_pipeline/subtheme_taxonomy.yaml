# NB (2026-08-16): i pattern di questa sezione sono stati ricalibrati misurando i
# contesti reali, non a intuito. La prima versione era tutta in italiano
# ('taglio dei tassi', 'punti base') mentre le schede scrivono in inglese
# tecnico: `rate_decision` restituiva 0 episodi date-locali su 94. Frequenze
# osservate sui 537 contesti di tema: fomc 77, bp 140, dot plot 64, hike 73,
# rialzo 67, cut 35, taglio 30, intervento 25, chair 16, ycc 12.
# Prima di aggiungere o cambiare un token: `analogues.py labels --theme <t>`.
monetary_policy:
  rate_decision:
    - '\bfomc\b'
    - '\d+\s*bps?\b'
    - '\b(rate|tassi)\s+(cut|hike)'
    - '\b(hike|cut)\b'
    - '(taglio|rialzo)\s+(di|dei|da|del)?\s*(tass|\d)'
    - 'punti base'
    - 'basis point'
    - 'terminal rate'
    - 'tasso terminale'
  guidance_pivot:
    - 'forward guidance'
    - '\bpivot\b'
    - 'dot plot'
    - '\bdots\b'
    - 'proiezioni'
    - 'hawkish'
    - 'dovish'
    - 'dissens'
    - '\bstatement\b'
  balance_sheet:
    - 'quantitative (easing|tightening)'
    - '\bqe\b'
    - '\bqt\b'
    - 'bilancio della banca centrale'
    - 'reinvestiment'
    - 'tapering'
  cb_independence:
    - 'indipendenza della banca centrale'
    - 'central bank independence'
    - 'pressione politica sulla (fed|bce)'
    - '\bchair\b'
    - 'presidente della fed'
    - 'nomina.{0,30}(fed|bce|governatore)'
  fx_intervention:
    - 'intervento (valutario|sul cambio|sulla valuta)'
    - 'fx intervention'
    - 'carry trade'
    - '\bycc\b'
    - 'yield curve control'
  # --- Aggiunti il 2026-08-18 (lacuna A dell'analisi del giorno) --------------
  # Il sistema non distingueva un selloff guidato dalle ASPETTATIVE SUI TASSI da
  # uno guidato dal PREMIO A TERMINE: hanno segno opposto sull'azionario, e
  # mescolarli nello stesso pool e' l'ipotesi piu' plausibile per l'IC negativo
  # di ^TNX (-0,20) e IEF (-0,29) nella scorecard W34.
  # Frequenze misurate sulle schede 2026 prima di scrivere i pattern:
  #   curva 328 · duration 292 · asta 185 · selloff 155 · sell-off 117 · ycc 82
  #   premio a termine 73 · term premium 71 · steepening 60 · gilt 50 · jgb 48
  #   parte lunga 39 · 30y 38 · irripidimento 15 · sincronizzat 10
  # 'curva' e 'duration' NON sono usati da soli: troppo generici, comparirebbero
  # in quasi ogni scheda di politica monetaria e non discriminerebbero nulla.
  #
  # ⚠ COPERTURA ATTUALE ~0 — E' UN SEME, NON UN FILTRO USABILE OGGI.
  # Misurato il 2026-08-18 su 2.805 contesti date-locali: term_premium 5,
  # synchronized_selloff 1, sovereign_auction 0. I pattern sono corretti (i match
  # trovati sono veri: 'term premium', 'premio a termine', 'steepening', '30 anni');
  # il problema e' STRUTTURALE, non di calibrazione: questo vocabolario vive nella
  # PROSA delle schede (73 'premio a termine' + 71 'term premium' in totale), non
  # nelle righe degli episodi datati, che sono telegrafiche ('2017-12-22 — Trump
  # firma il TCJA'). Le etichette date-locali vedono solo il testo attorno a una
  # data, quindi non possono catturarlo.
  # NON usare questi token in `find --subtheme` finche' `analogues.py labels` non
  # mostra copertura reale: si otterrebbe un pool sotto min-n che degrada in
  # silenzio al filtro debole. La strada e' far si' che le righe-episodio nominino
  # il MECCANISMO (v. passo 3 del PHASE5_RUNBOOK) piu' la research KB sul tema.
  term_premium:
    - 'premio a termine'
    - 'term premium'
    - 'parte lunga'
    - 'long end'
    - '\b30\s*(anni|y)\b'
    - 'scadenze lunghe'
    - 'rendimenti lunghi'
    - 'bear steepen'
    - 'steepening'
    - 'irripidiment'
  sovereign_auction:
    - '\baste?\b.{0,40}(titoli|jgb|gilt|treasury|btp|bund|stato)'
    - '(jgb|gilt|treasury|btp|bund).{0,40}\baste?\b'
    - 'bid-to-cover'
    - '\bauction\b'
    - 'domanda (debole|scarsa|ai minimi)'
  synchronized_selloff:
    - '(selloff|sell-off).{0,40}(global|sincronizzat|simultane|cross)'
    - '(global|sincronizzat|simultane).{0,40}(selloff|sell-off)'
    - '\bacgb\b'
    - '(jgb|gilt).{0,60}(gilt|jgb|acgb|treasury)'

macro_data:
  # Geografia della release (aggiunto 2026-08-26). Lacuna misurata il 25/08 in
  # news_06: `--subtheme pmi` dava 19 episodi in larga parte USA, e su EURUSD=X
  # la mediana risultava POSITIVA dopo un dato europeo debole perché il pool
  # descriveva in realtà debolezza americana (dollaro giù più dell'euro).
  # Gli episodi europei c'erano già in libreria — dalla research del 22/08 —
  # ma senza etichetta geografica erano indistinguibili da quelli americani.
  # NB: i nomi sono `eurozone_release`/`britain_release` e NON `eu_release`/
  # `uk_release`: in `local_labels` le parole di <=2 caratteri vengono scartate,
  # quindi entrambi i nomi brevi si riducevano alla sola parola "release" e
  # qualunque contesto che la contenesse attivava tutt'e due le etichette.
  # NB2: non esiste `us_release` di proposito. Marcare gli USA richiederebbe
  # pattern larghi ad alto rischio di falsi positivi, e il problema dichiarato
  # è isolare l'Europa: per il resto del pool il comportamento attuale basta.
  eurozone_release:
    - '\barea_euro\b'          # colonna Geografia della research 2026-08-22
    - 'area euro'
    - 'euro.?zona'
    - 'euro.?zone'
    - 'euro area'
    - '\bifo\b'
    - '\bzew\b'
    - '\bhicp\b'
    - 'bundesbank'
  # Solo pattern che identificano la RELEASE (istituzione o indicatore che
  # pubblica), mai gli effetti collaterali: `gilt`, `sterlina`, `\bons\b` erano
  # nella prima stesura e producevano falsi positivi su episodi USA, perché
  # `_contexts` estende le righe corte alle vicine e una menzione dell'effetto
  # sul cambio bastava a marcare l'episodio come britannico.
  britain_release:
    - '\bregno unito\b'
    - "banca d[''`]inghilterra"
    - 'bank of england'
    - '\bboe\b'
  # --- Geografie aggiunte il 2026-08-27 (lacuna 4 dell'analisi del giorno) -----
  # ⚠ LA LACUNA ERA MAL DIAGNOSTICATA, e la misura conta piu' della diagnosi.
  # L'analisi diceva: «la lacuna e' DI TASSONOMIA, non di copertura: il conteggio
  # date-locale e' zero perche' il token non esiste, non perche' sia sotto soglia».
  # Misurato sugli 8.735 contesti date-locali reali (schede + research KB) PRIMA
  # di scrivere questi pattern:
  #     australia_release   0     korea_release   1     canada_release   1
  #     japan_release     106  (monetary_policy 64 · macro_data 17 · KB 22)
  # Cioe': per Australia, Corea e Canada il conteggio resta ZERO anche con il
  # token, perche' non mancano le etichette — mancano gli EPISODI DATATI. Le 140
  # occorrenze di "RBA" e le 332 di "Corea" nelle schede vivono nella PROSA, non
  # nelle righe attorno a una data, e le etichette date-locali vedono solo quelle.
  # Stessa identica dinamica gia' documentata per `term_premium` (2026-08-18).
  # → Tre di questi quattro token sono SEMI, non filtri: servono perche' gli
  #   episodi FUTURI (e la research australiana della lacuna 5) nascano gia'
  #   etichettati. NON usarli in `find --subtheme` finche' `analogues.py labels`
  #   non mostra copertura reale: degraderebbero in silenzio al filtro debole.
  # → `japan_release` invece e' USABILE da subito su `monetary_policy` (64).
  # Solo pattern che identificano la RELEASE o l'ISTITUZIONE che la pubblica, mai
  # gli effetti collaterali: `\baustralia\b` generico e `\bcanada\b` generico sono
  # stati provati e SCARTATI — il secondo pescava 14 contesti quasi tutti di dazi
  # USA-Canada sotto `regulatory`/`geopolitical`, che non sono release macro.
  australia_release:
    - '\brba\b'
    - 'reserve bank of australia'
    - 'banca centrale australiana'
  korea_release:
    - 'bank of korea'
    - '\bbok\b'
    - 'banca centrale coreana'
  canada_release:
    - 'bank of canada'
    - '\bboc\b'
    - 'statistics canada'
    - 'banca del canada'
  japan_release:
    - '\bboj\b'
    - 'bank of japan'
    - 'banca del giappone'
    - '\btankan\b'
  labour_market:
    - 'occupazione'
    - 'payroll'
    - '\bnfp\b'
    - 'disoccupazione'
    - 'jobless'
    - 'mercato del lavoro'
  inflation_print:
    - '\bcpi\b'
    - '\bpce\b'
    - 'inflazione'
    - 'inflation'
    - 'deflatore'
  activity_growth:
    - '\bpil\b'
    - '\bgdp\b'
    - '\bpmi\b'
    - 'produzione industriale'
    - 'ism'
  consumer:
    - 'vendite al dettaglio'
    - 'retail sales'
    - 'fiducia dei consumatori'
