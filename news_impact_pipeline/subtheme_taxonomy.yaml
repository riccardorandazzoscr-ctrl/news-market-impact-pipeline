# subtheme_taxonomy.yaml — etichette di sotto-tema CANONICHE e loro pattern.
#
# Perché esiste (lacuna dichiarata nell'analisi 2026-08-15): le etichette di
# sotto-tema erano prese dal campo `sub_themes` della scheda/ricerca e applicate
# a TUTTE le date citate da quel documento. Risultato: su `structural_themes`
# 53 episodi su 58 avevano `semis`, 52 `ai_capex`, 49 `valuation_derisking` →
# `analogues.py find --subtheme` non discriminava, e schede con domande diverse
# (news_03 = finanziamento del capex, news_04 = ciclo della memoria) ottenevano
# lo stesso pool.
#
# Come si usa: `analogues.py build` prende il CONTESTO LOCALE di ogni data (la
# riga di tabella / il bullet / il paragrafo in cui compare) e ci cerca dentro
# questi pattern. Le etichette che matchano finiscono in `subthemes_local`, che
# è specifico dell'episodio invece che del documento. `find --subtheme` prova
# prima `subthemes_local`, poi ricade sull'unione, poi sul tema.
#
# Formato: <tema canonico>: { <etichetta>: [regex, ...] }. La sezione `_any`
# vale per tutti i temi. Match case-insensitive su testo IT/EN.
# Aggiungere etichette è sicuro: non tocca `subthemes` (unione storica), che
# resta come rete di recall.

_any:
  export_controls:
    - 'export control'
    - 'entity list'
    - 'controlli? (all[\''`]?)?export'
    - 'restrizioni? (all[\''`]?)?export'
    - 'divieto di esportazion'
  tariff_escalation:
    - '\btariff'
    - '\bdazi\b'
    - 'dazio'
    - 'guerra commerciale'
    - 'trade war'
    - 'section 301'
  sanctions:
    - '\bsanzion'
    - '\bsanction'
    - '\bembargo'
    - 'price cap'
  election_risk:
    - '\belezion'
    - '\belection'
    - 'ballottaggio'
    - 'run-?off'
    - 'sondagg'
    - '\bpoll\b'
  # Aggiunto il 2026-08-16: gli attriti commerciali Giappone-Cina sono stati
  # scartati per la terza volta perché il canale (dogane, avvisi turistici,
  # licenze terre rare) non aveva alcun token. Il tratto distintivo è che la
  # ritorsione è AMMINISTRATIVA e differita, non tariffaria e immediata:
  # merita un'etichetta propria, non `tariff_escalation`.
  administrative_retaliation:
    - 'ritardi doganal'
    - 'controlli doganal'
    - 'blocco doganale'
    - 'avvis[oi] (di viaggio|turistic)'
    - 'travel advisory'
    - 'sospensione delle licenze'
    - 'licenz\w+ (di|all[\''`]?)export'
    - 'terre rare'
    - 'rare earth'
    - 'boicottagg'
    - 'ispezioni (straordinarie|sanitarie)'
    - 'yasukuni'

