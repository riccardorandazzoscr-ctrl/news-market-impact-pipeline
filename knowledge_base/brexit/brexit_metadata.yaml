metodologia_controfattuale:
  descrizione: >
    Approccio doppelganger / synthetic control: costruzione di un'economia
    "gemella" del UK usando una media ponderata di paesi comparatori (USA,
    Canada, Australia, Norvegia, Svizzera, Germania, Francia, ecc.) che
    replicano le caratteristiche pre-2016 del UK su PIL, commercio,
    produttività. La divergenza post-2016 tra UK e doppelganger è attribuita
    causalmente alla Brexit. Critica principale: scelta dei pesi e dei paesi
    comparatori influenza le stime; shock asimmetrici (COVID, energia, Trump
    tariffs) non facilmente isolabili.
  principale_riferimento: "Springford (CER, aggiornamenti 2018–2025)"
  critica_principale: "Gudgin–Lu (UKICE WP 5); Policy Exchange (2024)"
  risposta_alla_critica: "Portes (2023): ECM alternativo produce risultati funzionalmente identici"
  range_stime_PIL: "-3.25% (BoE) / -4% (OBR) / -5 to -5.5% (CER) / -6 to -8% (NBER WP 34459)"
