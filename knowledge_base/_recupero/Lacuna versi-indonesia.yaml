research: lacuna versi-indonesia (geopolitical, indonesia, rif IDR=X; sotto-tema locale)
voci:
- data: '2025-07-22'
  tema: geopolitical
  fonte: 'kb:ASEAN : Sud-Est asiatico- shock geopolitici — regime ed episodi storici (2010–2026)/ASEAN
    : Sud-Est asiatico- shock geopolitici — regime ed episodi storici (2010–2026).md'
  riga: '| 2025-07-22 | Framework USA-Indonesia/Filippine: dazio ridotto al 19% | leva tariffaria | pos.
    IDR/PHP | IDR, EIDO | Riduzione da 32%/20% a 19% |'
  evento: Dichiarazione congiunta USA-Indonesia sul quadro dell'accordo (dazio al 19%)
  meccanismo:
  - tariff_escalation
  dichiarazioni:
  - asset: IDR=X
    verso: neutral
    perché: 'Il 19% per l''Indonesia era stato annunciato da Trump il 15/7/2025 (Washington Times, RNZ
      16/7); il 22/7 la Casa Bianca pubblica solo il quadro scritto. Nessuna sorpresa sul dazio alla data:
      pressione attesa nulla. Se si vuole l''episodio vero, è il 2025-07-15 (pos per la rupia, quindi
      neg su IDR=X), non in libreria. Criterio ex ante, nessun prezzo consultato.'
  stato: promossa
- data: '2025-04-02'
  tema: geopolitical
  fonte: 'kb:ASEAN : Sud-Est asiatico- shock geopolitici — regime ed episodi storici (2010–2026)/ASEAN
    : Sud-Est asiatico- shock geopolitici — regime ed episodi storici (2010–2026).md'
  riga: '| 2025-04-02 | Dazi "Liberation Day" USA (Cambogia 49%, Vietnam 46%, Thailandia 36%, Indonesia
    32%, Malaysia 24%, Singapore 10% baseline) | leva tariffaria | neg. valute/equity ASEAN (forte) |
    THB, IDR, MYR, EIDO, THD, EWS, CNY |'
  evento: Dazi reciproci "Liberation Day", Indonesia al 32%
  meccanismo:
  - tariff_escalation
  dichiarazioni:
  - asset: IDR=X
    verso: pos
    perché: 'Dazio del 32% sull''Indonesia, molto sopra il 10% di base che il mercato considerava lo scenario
      centrale: pressione attesa al ribasso sulla rupia, quindi al rialzo su USD/IDR. ⚠ Annuncio a mercati
      USA chiusi e borsa di Giacarta chiusa per Lebaran fino all''8/4: tempistica da controllare, non
      il verso. Criterio ex ante, nessun prezzo consultato.'
  stato: promossa
- data: '2024-02-14'
  tema: geopolitical
  fonte: 'kb:ASEAN : Sud-Est asiatico- shock geopolitici — regime ed episodi storici (2010–2026)/ASEAN
    : Sud-Est asiatico- shock geopolitici — regime ed episodi storici (2010–2026).md'
  riga: '| 2024-02-14 | Elezione presidenziale Indonesia (voto), Prabowo vince al 1° turno | elezione
    a rischio | pos. equity IND / neutro IDR | IDR, EIDO |'
  evento: Presidenziali indonesiane, Prabowo in testa al primo turno nei conteggi rapidi
  meccanismo:
  - election_risk
  dichiarazioni:
  - asset: IDR=X
    verso: neutral
    perché: 'I sondaggi davano Prabowo vicino o sopra il 50%: la vittoria al primo turno era lo scenario
      atteso. Toglie il rischio di ballottaggio (positivo) ma conferma un programma di spesa che preoccupava
      sul deficit (negativo): sulla rupia nessuna pressione netta. Coerente con la research ("neutro IDR").
      Criterio ex ante, nessun prezzo consultato.'
  stato: promossa
- data: '2014-07-09'
  tema: geopolitical
  fonte: 'kb:ASEAN : Sud-Est asiatico- shock geopolitici — regime ed episodi storici (2010–2026)/ASEAN
    : Sud-Est asiatico- shock geopolitici — regime ed episodi storici (2010–2026).md'
  riga: '| 2014-07-09 | Elezione presidenziale Indonesia (voto), Jokowi favorito | elezione a rischio
    | pos. IDR/equity IND al risultato | IDR, EIDO |'
  evento: Presidenziali indonesiane, conteggi rapidi favorevoli a Jokowi
  meccanismo:
  - election_risk
  dichiarazioni:
  - asset: IDR=X
    verso: neg
    perché: 'Jokowi era il candidato preferito dal mercato (il "Jokowi effect") e il suo vantaggio nei
      sondaggi si era ridotto nelle ultime settimane: i conteggi rapidi a suo favore sono una sorpresa
      positiva per la rupia, quindi pressione al ribasso su USD/IDR. Confidenza bassa: anche Prabowo rivendicava
      la vittoria. Criterio ex ante, nessun prezzo consultato.'
  stato: promossa
