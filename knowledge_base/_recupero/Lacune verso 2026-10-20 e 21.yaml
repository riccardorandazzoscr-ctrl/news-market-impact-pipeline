voci:
- data: '2025-11-24'
  tema: geopolitical
  fonte: kb:Il corridoio cerealicolo del Mar Nero- guerra, accordi sul grano e trasmissione ai mercati
    — regime ed episodi storici (2013–presente)/Il corridoio cerealicolo del Mar Nero- guerra, accordi
    sul grano e trasmissione ai mercati — regime ed episodi storici (2013–presente).md
  evento: 'Prospettiva di pace: colloqui di Ginevra sul piano USA (domenica 23/11)'
  meccanismo:
  - negotiation_track
  - de_escalation
  dichiarazioni:
  - asset: ZW=F
    verso: neutral
    perché: 'Trattativa senza accordo operativo: con il corridoio unilaterale che già trasporta volumi
      quasi pre-bellici il canale dell''offerta fisica non si muove (research Mar Nero §5, regime negotiation_2025_2026;
      stessa convenzione del 2026-09-06). La research nota il grano muto sul cluster C. Revisione Claude
      2026-10-21.'
  - asset: TTF=F
    verso: neg
    perché: 'Apertura negoziale Russia-Ucraina: la prospettiva di distensione sgonfia il premio di rischio
      sul gas europeo (research Mar Nero §4, cluster C). Revisione Claude 2026-10-21.'
  - asset: BZ=F
    verso: neg
    perché: 'Apertura negoziale Russia-Ucraina: premio di rischio in calo e prospettiva di allentamento
      delle sanzioni sul greggio russo (research Mar Nero §4, cluster C). Revisione Claude 2026-10-21.'
  stato: promossa
